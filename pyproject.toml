[project]
name = "zoologist"
version = "0.1.0"
description = "Classifying penguins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-cloud-storage>=3.13.1",
    "pandas<3",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
